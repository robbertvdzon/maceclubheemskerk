name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maceclubheemskerk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Go in Docker
        run: docker compose run --build --rm tools go vet ./...
      - name: Test secrets tooling
        run: python3 -m unittest discover -s tests -v
      - name: Render OpenShift manifests
        run: kubectl kustomize deploy > /dev/null
      - name: Build runtime
        run: docker build --tag maceclubheemskerk:verify .
      - name: Check HTTP, arbitrary UID and shutdown
        run: python3 deploy/smoke-test.py maceclubheemskerk:verify

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robbertvdzon/maceclubheemskerk:sha-${{ github.sha }}
          cache-from: type=gha,scope=maceclubheemskerk
          cache-to: type=gha,mode=max,scope=maceclubheemskerk

  pin-image:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.8.0"
      - name: Pin verified image for Argo CD
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]]; then
            echo 'Main is bijgewerkt; de nieuwere workflow verzorgt de deployment.'
            exit 0
          fi
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cd deploy
          kustomize edit set image "ghcr.io/robbertvdzon/maceclubheemskerk=ghcr.io/robbertvdzon/maceclubheemskerk@${IMAGE_DIGEST}"
          kustomize build . > /dev/null
          cd ..
          if git diff --quiet -- deploy/kustomization.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/kustomization.yaml
          git commit -m "deploy: pin image for ${SOURCE_SHA} [skip ci]"
          # Bij een gelijktijdige push faalt dit veilig; geen oude image over nieuwe main.
          git push origin HEAD:main
