services:
  web:
    build: .
    env_file:
      - path: secrets.env
        required: false
        format: raw
    environment:
      SESSION_FILE: /data/sessions.json
      SQLITE_FILE: /data/maceclub.sqlite
      VIDEO_DIR: /videos
      APP_ORIGINS: http://localhost:18080,http://127.0.0.1:18080
      COOKIE_SECURE: "false"
    volumes:
      - sessions:/data
      - videos:/videos
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
  tools:
    profiles: [tools]
    build:
      context: .
      target: toolchain
    volumes:
      - .:/src
      - go-cache:/root/.cache/go-build
      - go-modules:/go/pkg/mod
    command: [go, vet, ./...]
volumes:
  sessions:
  videos:
  go-cache:
  go-modules:
