apiVersion: apps/v1
kind: Deployment
metadata:
  name: maceclubheemskerk
  annotations:
    secret.reloader.stakater.com/reload: maceclubheemskerk-secrets
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maceclubheemskerk
  template:
    metadata:
      labels:
        app: maceclubheemskerk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: maceclubheemskerk-sessions-local
        - name: videos
          persistentVolumeClaim:
            claimName: maceclubheemskerk-videos
      containers:
        - name: web
          image: ghcr.io/robbertvdzon/maceclubheemskerk:bootstrap
          envFrom:
            - secretRef:
                name: maceclubheemskerk-secrets
                optional: true
          env:
            - name: SESSION_FILE
              value: /data/sessions.json
            - name: SQLITE_FILE
              value: /data/maceclub.sqlite
            - name: VIDEO_DIR
              value: /videos
          volumeMounts:
            - name: sessions
              mountPath: /data
            - name: videos
              mountPath: /videos
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: maceclubheemskerk
spec:
  selector:
    app: maceclubheemskerk
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/timeout: 10m
  name: maceclubheemskerk
spec:
  host: maceclubheemskerk.eu
  to:
    kind: Service
    name: maceclubheemskerk
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/timeout: 10m
  name: maceclubheemskerk-www
spec:
  host: www.maceclubheemskerk.eu
  to:
    kind: Service
    name: maceclubheemskerk
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
