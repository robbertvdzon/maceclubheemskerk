apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maceclubheemskerk-sessions-local
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    # Kubernetes local volumes support SELinux relabelling and fsGroup;
    # the provisioner's default hostPath volumes do not.
    volumeType: local
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
